[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nibal-ink-backend"
version = "0.1.0"
description = "Backend de Nibal.ink"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "qrcode[pil]>=7.4",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
