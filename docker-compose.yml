services:
  db:
    image: postgres:15-alpine
    container_name: nibal_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: nibal_user
      POSTGRES_PASSWORD: nibal_pass_local
      POSTGRES_DB: nibal_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibal_user -d nibal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
