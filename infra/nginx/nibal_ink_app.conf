# nibal_ink_app.conf
# Config del proxy central para nibal.ink
# Se copia a ~/dockerized_websites/infra/nginx/nibal_ink_app.conf en la VPS.
#
# Rutea:
#   /api/*       -> nibal_backend:8000
#   /t/*, /s/*   -> nibal_frontend:80 (modal 3D)
#   /*           -> nibal_ink_legacy:80 (landing existente)

server {
    listen 80;
    server_name nibal.ink www.nibal.ink;

    server_tokens off;

    # headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.nibal.ink; font-src 'self'; connect-src 'self' https://assets.nibal.ink; worker-src 'self' blob:; frame-ancestors 'self';" always;

    # limite de tamano de body (para uploads futuros del admin)
    client_max_body_size 20M;

    # --- API ---
    location /api/ {
        proxy_pass http://nibal_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # --- modal (tazas y shares) ---
    location ~ ^/(t|s)/ {
        proxy_pass http://nibal_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # --- landing actual (nibal_ink_legacy) ---
    location / {
        proxy_pass http://nibal_ink_legacy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
