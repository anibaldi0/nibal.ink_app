# assets_nibal_ink.conf
# Config del proxy central para assets.nibal.ink
# Se copia a ~/dockerized_websites/infra/nginx/assets_nibal_ink.conf en la VPS.
#
# Rutea:
#   /*  -> nibal_assets:80 (contenedor con el volumen de assets montado)

server {
    listen 80;
    server_name assets.nibal.ink;

    server_tokens off;

    location / {
        proxy_pass http://nibal_assets:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
