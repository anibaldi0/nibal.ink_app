# Config interna del contenedor nibal_assets.
# Solo sirve archivos estaticos del volumen /var/www/assets.
# El proxy central (nibalink_proxy) le manda el trafico de
# assets.nibal.ink a este contenedor.

server {
    listen 80;
    server_name _;

    root /var/www/assets;
    index off;

    server_tokens off;

    # solo GET y HEAD
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location / {
        try_files $uri =404;

        # cache agresivo: los assets son inmutables (si cambia el diseno
        # se crea una carpeta nueva con otro slug)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # CORS: permite nibal.ink y www.nibal.ink
        set $cors_origin "";
        if ($http_origin ~ "^https://(www\.)?nibal\.ink$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~ "^http://localhost:5173$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # bloqueo de archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # health check para Docker
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
