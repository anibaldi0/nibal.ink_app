server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # SPA: cualquier ruta que no sea un archivo, devuelve index.html
    # para que React Router maneje el ruteo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets con hash en el nombre: cache agresivo
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html siempre fresco
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # no mostrar nginx en headers
    add_header X-Content-Type-Options "nosniff" always;

    # no loggear los health checks
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
